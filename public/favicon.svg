<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="100" height="100" fill="url(#bg)" rx="22"/>
  
  <!-- Rocket body -->
  <path d="M 50 22 
           L 58 38
           L 58 58
           L 50 65
           L 42 58
           L 42 38
           Z" 
        fill="white"/>
  
  <!-- Rocket window -->
  <circle cx="50" cy="42" r="5" fill="#6366F1"/>
  
  <!-- Left fin -->
  <path d="M 42 52 L 35 58 L 42 58 Z" fill="#E0E7FF"/>
  
  <!-- Right fin -->
  <path d="M 58 52 L 65 58 L 58 58 Z" fill="#E0E7FF"/>
  
  <!-- Rocket flames -->
  <path d="M 45 65 L 43 75 L 45 72 Z" fill="#FCD34D" opacity="0.9"/>
  <path d="M 50 65 L 48 78 L 52 78 L 50 65 Z" fill="#FCD34D" opacity="0.9"/>
  <path d="M 55 65 L 57 75 L 55 72 Z" fill="#FCD34D" opacity="0.9"/>
</svg>
